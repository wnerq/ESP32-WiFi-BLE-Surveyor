[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_eol = LF
monitor_dtr = 0
monitor_rts = 0
monitor_filters = send_on_enter, time, esp32_exception_decoder, log2file
board_build.partitions = huge_app.csv

lib_deps =
    h2zero/NimBLE-Arduino @ 2.5.0

; Keep an Arduino IDE-compatible sketch synchronized with the canonical source.
; The exporter only rewrites the .ino when the generated contents change.
extra_scripts =
    pre:tools/export_arduino.py
